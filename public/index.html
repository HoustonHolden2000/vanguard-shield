<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Vanguard Shield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/dynamsoft-barcode-reader-bundle@11.0.3000/dist/dbr.bundle.js"></script>
<script src="https://unpkg.com/@zxing/library@0.21.0/umd/index.min.js"></script>
<style>
:root {
  --bg: #000000;
  --bg-card: #0E0E0E;
  --bg-input: #060606;
  --white: #FFFFFF;
  --silver: #B8B8B8;
  --graphite: #555555;
  --ink: #1F1F1F;
  --green: #16C45A;
  --yellow: #F5C518;
  --red: #FF3B30;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  background: var(--bg);
  color: var(--white);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ========== WORDMARK ========== */
.wordmark { text-align: center; user-select: none; color: var(--white); }
.wordmark .vanguard {
  font-family: 'Inter', sans-serif;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1;
  text-transform: uppercase;
}
.wordmark .rule {
  height: 1px;
  background: var(--white);
  opacity: 0.6;
  margin: 6px auto;
}
.wordmark .shield {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  text-transform: uppercase;
  line-height: 1;
}
.wordmark.size-hero .vanguard { font-size: 38px; }
.wordmark.size-hero .shield   { font-size: 14px; letter-spacing: 0.55em; padding-left: 0.55em; }
.wordmark.size-hero .rule     { width: 64%; }
.wordmark.size-header .vanguard { font-size: 18px; }
.wordmark.size-header .shield   { font-size: 9px; letter-spacing: 0.45em; padding-left: 0.45em; }
.wordmark.size-header .rule     { width: 70%; margin: 3px auto; }

.shield-glyph {
  display: block; margin: 0 auto 22px;
  width: 42px; height: 48px;
}
.shield-glyph path { stroke: var(--white); stroke-width: 1.6; fill: none; stroke-linejoin: round; }
.header-glyph { width: 24px; height: 28px; }
.header-glyph path { stroke: var(--white); stroke-width: 1.6; fill: none; }

/* ========== HEADER ========== */
.header {
  background: var(--bg);
  border-bottom: 1px solid var(--ink);
  padding: 14px 18px;
  display: flex; justify-content: space-between; align-items: center;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header .user-info {
  font-size: 11px; color: var(--silver);
  letter-spacing: 0.08em; text-transform: uppercase;
  font-weight: 500;
}
.header .logout-btn {
  background: transparent;
  border: 1px solid var(--ink);
  color: var(--silver);
  padding: 6px 14px; border-radius: 4px;
  font-size: 11px; font-family: inherit;
  letter-spacing: 0.14em; text-transform: uppercase;
  cursor: pointer; transition: all 0.18s ease;
  margin-top: 4px; font-weight: 500;
}
.header .logout-btn:hover, .header .logout-btn:active {
  border-color: var(--white); color: var(--white);
}

/* ========== LOGIN ========== */
.login-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 100vh; padding: 20px;
}
.login-box {
  background: var(--bg-card);
  border: 1px solid var(--ink);
  border-radius: 14px;
  padding: 52px 32px 36px;
  width: 100%; max-width: 360px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.5);
}
.login-box .wordmark { margin-bottom: 38px; }
.login-box input {
  width: 100%; padding: 15px 16px; margin-bottom: 12px;
  background: var(--bg-input);
  border: 1px solid var(--ink);
  border-radius: 6px;
  color: var(--white);
  font-size: 16px; font-family: inherit;
  outline: none; transition: border-color 0.18s ease;
}
.login-box input::placeholder { color: var(--graphite); letter-spacing: 0.04em; }
.login-box input:focus { border-color: var(--white); }
.login-box .login-btn {
  width: 100%; padding: 16px;
  margin-top: 12px;
  background: var(--white);
  border: none; border-radius: 6px;
  color: #000;
  font-size: 14px; font-weight: 700;
  font-family: inherit;
  letter-spacing: 0.32em; text-transform: uppercase;
  cursor: pointer; transition: all 0.12s ease;
}
.login-box .login-btn:active { background: #E0E0E0; transform: translateY(1px); }
.login-error {
  color: var(--red);
  font-size: 13px; margin-top: 14px; min-height: 18px;
  letter-spacing: 0.02em; font-weight: 500;
}
.login-footer {
  margin-top: 30px; text-align: center;
  font-size: 9.5px; color: var(--graphite);
  letter-spacing: 0.32em; text-transform: uppercase;
}
/* ========== APP ========== */
.app-screen { display: none; }
.app-screen.active { display: block; }
.app-content { padding-bottom: 88px; }

/* ========== SCAN ========== */
.scan-section { padding: 28px 18px 12px; }
.scan-btn {
  width: 100%; padding: 28px 20px;
  background: var(--white);
  border: none; border-radius: 14px;
  color: #000;
  font-size: 22px; font-weight: 800; font-family: inherit;
  letter-spacing: 0.18em; text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex; align-items: center; justify-content: center; gap: 14px;
}
.scan-btn:active { background: #E0E0E0; transform: translateY(2px); }
.scan-btn-icon {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
}
.scan-hint {
  text-align: center; margin-top: 14px;
  font-size: 12px; color: var(--graphite);
  letter-spacing: 0.06em;
}

/* ========== STATUS — FIRST PRINCIPLES, GUARD SEES COLOR ========== */
.status-banner {
  display: none;
  margin: 14px 18px;
  padding: 22px 18px;
  border-radius: 12px;
  text-align: center;
  font-size: 18px; font-weight: 800;
  letter-spacing: 0.08em; text-transform: uppercase;
  border: 2px solid transparent;
}
.status-banner.processing {
  background: var(--yellow); color: #000;
  border-color: var(--yellow);
  display: block;
}
.status-banner.success {
  background: var(--green); color: #000;
  border-color: var(--green);
  display: block;
}
.status-banner.fail {
  background: var(--red); color: #FFF;
  border-color: var(--red);
  display: block;
}
.status-banner.partial {
  background: var(--yellow); color: #000;
  border-color: var(--yellow);
  display: block;
}
.status-banner-sub {
  display: block;
  margin-top: 6px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  opacity: 0.75;
  text-transform: none;
}

/* ========== RESULT ========== */
.result-card {
  margin: 14px 18px; padding: 22px;
  background: var(--bg-card);
  border-radius: 12px;
  border: 1px solid var(--ink);
  display: none;
}
.result-card.visible { display: block; }
.result-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 18px; padding-bottom: 14px;
  border-bottom: 1px solid var(--ink);
}
.result-title {
  font-size: 11px; color: var(--silver);
  letter-spacing: 0.32em; text-transform: uppercase;
  font-weight: 600;
}
.risk-badge {
  padding: 7px 16px; border-radius: 100px;
  font-size: 11px; font-weight: 800;
  letter-spacing: 0.18em; text-transform: uppercase;
}
.risk-green  { background: var(--green); color: #000; }
.risk-yellow { background: var(--yellow); color: #000; }
.risk-red    { background: var(--red); color: #FFF; }

.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.field-label {
  font-size: 9.5px; color: var(--graphite);
  letter-spacing: 0.18em; text-transform: uppercase;
  margin-bottom: 4px; font-weight: 500;
}
.field-value { font-size: 16px; color: var(--white); font-weight: 500; }
.field-value.empty { color: #2C2C2C; font-style: italic; }
.field-full { grid-column: 1 / -1; }

.action-row { display: flex; gap: 10px; margin: 14px 18px; }
.action-btn {
  flex: 1; padding: 16px; border: none; border-radius: 8px;
  font-size: 13px; font-weight: 700; font-family: inherit;
  letter-spacing: 0.22em; text-transform: uppercase;
  cursor: pointer; transition: all 0.15s ease;
}
.btn-save  { background: var(--white); color: #000; }
.btn-retry { background: transparent; color: var(--silver); border: 1px solid var(--ink); }
.btn-retry:active { border-color: var(--white); color: var(--white); }
.btn-retry-big {
  width: calc(100% - 36px); margin: 14px 18px; padding: 22px;
  background: var(--red);
  border: none; border-radius: 12px;
  color: #FFF; font-size: 17px; font-weight: 800; font-family: inherit;
  letter-spacing: 0.16em; text-transform: uppercase;
  cursor: pointer; display: none;
}

/* ========== NAV ========== */
.nav-tabs {
  display: flex;
  border-top: 1px solid var(--ink);
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg); z-index: 100;
}
.nav-tab {
  flex: 1; padding: 14px 0;
  text-align: center;
  font-size: 10px; font-family: inherit;
  color: var(--graphite); cursor: pointer;
  border: none; background: none;
  letter-spacing: 0.18em; text-transform: uppercase;
  font-weight: 500;
  transition: color 0.15s ease;
}
.nav-tab.active {
  color: var(--white);
  border-top: 2px solid var(--white);
  margin-top: -1px;
}
.nav-tab .tab-icon { font-size: 18px; display: block; margin-bottom: 3px; }

/* ========== HISTORY ========== */
.history-section { padding: 18px; padding-bottom: 80px; }
.history-item {
  background: var(--bg-card);
  border: 1px solid var(--ink);
  border-radius: 10px;
  padding: 14px 16px; margin-bottom: 10px;
  display: flex; justify-content: space-between; align-items: center;
}
.history-name { font-size: 14px; color: var(--white); font-weight: 500; }
.history-time { font-size: 11px; color: var(--graphite); margin-top: 2px; }
.history-badge {
  padding: 5px 12px; border-radius: 100px;
  font-size: 10.5px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase;
}
.empty-history {
  text-align: center; padding: 60px 20px;
  color: var(--graphite); font-size: 13px;
}

/* ========== MISC ========== */
#cameraInput { display: none; }
.loading-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.92); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  z-index: 200;
  display: none; flex-direction: column; align-items: center; justify-content: center;
}
.loading-overlay.visible { display: flex; }
.loading-spinner {
  width: 48px; height: 48px;
  border: 3px solid var(--ink);
  border-top-color: var(--white);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  margin-top: 18px; font-size: 14px; color: var(--white);
  letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600;
}
.loading-sub { margin-top: 8px; font-size: 11px; color: var(--silver); letter-spacing: 0.04em; }

/* ========== BOL ========== */
.bol-section { padding: 0 18px; }
.bol-card {
  margin: 14px 0; padding: 22px;
  background: var(--bg-card);
  border-radius: 12px;
  border: 1px solid var(--ink);
}
.bol-title {
  font-size: 11px; color: var(--silver); letter-spacing: 0.32em;
  text-transform: uppercase; font-weight: 600;
  margin-bottom: 16px; padding-bottom: 14px;
  border-bottom: 1px solid var(--ink);
}
.bol-field { margin-bottom: 14px; }
.bol-field:last-child { margin-bottom: 0; }
.bol-field label {
  display: block;
  font-size: 9.5px; color: var(--graphite);
  letter-spacing: 0.18em; text-transform: uppercase;
  margin-bottom: 6px; font-weight: 500;
}
.bol-field input {
  width: 100%; padding: 12px 14px;
  background: var(--bg-input);
  border: 1px solid var(--ink);
  border-radius: 6px;
  color: var(--white); font-size: 14px; font-family: inherit;
  outline: none; transition: border-color 0.15s ease;
}
.bol-field input:focus { border-color: var(--white); }
.bol-field input::placeholder { color: var(--graphite); }

/* ========== DIAGNOSTICS ========== */
.diag-line {
  font-size: 10px; color: var(--graphite);
  text-align: center; padding: 6px;
  letter-spacing: 0.04em;
}
.diag-line .ok { color: var(--green); }
.diag-line .warn { color: var(--yellow); }
.diag-line .err { color: var(--red); }
</style>
</head>
<body>

<!-- =================== LOGIN =================== -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <svg class="shield-glyph" viewBox="0 0 42 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M21 2 L38 9 V24 C38 35 30 43 21 46 C12 43 4 35 4 24 V9 Z"/>
    </svg>
    <div class="wordmark size-hero">
      <div class="vanguard">VANGUARD</div>
      <div class="rule"></div>
      <div class="shield">SHIELD</div>
    </div>
    <input type="text" id="loginUser" placeholder="Username" autocomplete="username" autocapitalize="none">
    <div style="position:relative;">
      <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password" style="padding-right:44px;">
      <button type="button" onclick="togglePass()" id="eyeBtn" style="position:absolute;right:8px;top:38%;transform:translateY(-50%);background:none;border:none;color:var(--graphite);font-size:18px;cursor:pointer;padding:6px;">&#x1f441;</button>
    </div>
    <button class="login-btn" onclick="doLogin()">Enter</button>
    <div class="login-error" id="loginError"></div>
    <div class="login-footer">Chain &middot; of &middot; Custody</div>
  </div>
</div>
<!-- =================== APP =================== -->
<div id="appScreen" class="app-screen">
  <div class="header">
    <div class="header-left">
      <svg class="header-glyph" viewBox="0 0 24 28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 1 L22 5 V14 C22 21 17 25 12 27 C7 25 2 21 2 14 V5 Z"/>
      </svg>
      <div class="wordmark size-header" style="text-align:left;">
        <div class="vanguard">VANGUARD</div>
        <div class="rule" style="margin: 2px 0;"></div>
        <div class="shield" style="text-align:left;padding-left:0;">SHIELD</div>
      </div>
    </div>
    <div style="text-align:right">
      <div class="user-info" id="userDisplay"></div>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="app-content">
    <div id="tabScan" class="tab-content active">
      <div class="scan-section">
        <button class="scan-btn" onclick="startScan()">
          <span class="scan-btn-icon">&#x1f4f7;</span>
          <span>Scan License</span>
        </button>
        <div class="scan-hint">Photograph the BACK of the license &middot; hold steady &middot; good lighting</div>
        <div class="diag-line" id="diagLine"></div>
      </div>

      <div class="status-banner" id="statusBar"></div>

      <div class="result-card" id="resultCard">
        <div class="result-header">
          <div class="result-title">Scan Result</div>
          <div class="risk-badge" id="riskBadge">VERIFIED</div>
        </div>
        <div class="field-grid">
          <div class="field-item"><div class="field-label">First Name</div><div class="field-value" id="fFirstName">-</div></div>
          <div class="field-item"><div class="field-label">Last Name</div><div class="field-value" id="fLastName">-</div></div>
          <div class="field-item"><div class="field-label">Date of Birth</div><div class="field-value" id="fDOB">-</div></div>
          <div class="field-item"><div class="field-label">License Number</div><div class="field-value" id="fDLNumber">-</div></div>
          <div class="field-item"><div class="field-label">Expiration</div><div class="field-value" id="fExpiration">-</div></div>
          <div class="field-item"><div class="field-label">State</div><div class="field-value" id="fState">-</div></div>
          <div class="field-item field-full"><div class="field-label">Address</div><div class="field-value" id="fAddress">-</div></div>
        </div>
      </div>
      <div class="bol-section" id="bolSection" style="display:none">
        <div class="bol-card">
          <div class="bol-title">Bill of Lading Verification</div>
          <div class="bol-field">
            <label>Carrier Name</label>
            <input type="text" id="bolCarrier" placeholder="Enter carrier name" autocapitalize="words">
          </div>
          <div class="bol-field">
            <label>BOL / PO Number</label>
            <input type="text" id="bolNumber" placeholder="Enter BOL or PO number" autocapitalize="characters">
          </div>
          <div class="bol-field">
            <label>Load Description</label>
            <input type="text" id="bolLoad" placeholder="e.g. 17 pallets electronics" autocapitalize="sentences">
          </div>
          <div class="bol-field">
            <label>Dock / Gate Number</label>
            <input type="text" id="bolDock" placeholder="e.g. Dock 4, Gate B">
          </div>
        </div>
      </div>
      <div class="action-row" id="actionRow" style="display:none">
        <button class="action-btn btn-retry" onclick="startScan()">Rescan</button>
        <button class="action-btn btn-save" onclick="saveScan()">Save</button>
      </div>
      <button class="btn-retry-big" id="retryBtn" onclick="startScan()">Scan Failed &middot; Tap to Retry</button>
    </div>
    <div id="tabHistory" class="tab-content" style="display:none">
      <div class="history-section" id="historyList"><div class="empty-history">No scans yet</div></div>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('Scan')"><span class="tab-icon">&#x1f50d;</span>Scan</button>
    <button class="nav-tab" onclick="switchTab('History')"><span class="tab-icon">&#x1f4cb;</span>History</button>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">Processing</div>
  <div class="loading-sub" id="loadingSub"></div>
</div>
<input type="file" id="cameraInput" accept="image/*" capture="environment">

<script>
let currentUser=null,lastScanData=null,sdkReady=false,cvRouter=null,parser=null;
let lastGpsPosition=null;
let sdkErrorMsg=null;
let scanCount=0;

// === auth helpers (JWT) ===
function tokenGet(name){try{return localStorage.getItem(name);}catch(e){return null;}}
function tokenSet(name,val){try{localStorage.setItem(name,val);}catch(e){}}
function tokenClear(){try{localStorage.removeItem('ihv_access');localStorage.removeItem('ihv_refresh');localStorage.removeItem('ihv_user');}catch(e){}}
function authHeader(){const t=tokenGet('ihv_access');return t?{'Authorization':'Bearer '+t}:{};}
async function authFetch(url,opts){
  opts=opts||{};opts.headers=Object.assign({},opts.headers||{},authHeader());
  let res=await fetch(url,opts);
  if(res.status===401){
    const refreshed=await tryRefresh();
    if(refreshed){opts.headers=Object.assign({},opts.headers,authHeader());res=await fetch(url,opts);}
  }
  return res;
}
async function tryRefresh(){
  const rt=tokenGet('ihv_refresh');if(!rt)return false;
  try{
    const res=await fetch('/api/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});
    if(!res.ok){tokenClear();return false;}
    const data=await res.json();
    tokenSet('ihv_access',data.access_token);if(data.refresh_token)tokenSet('ihv_refresh',data.refresh_token);
    return true;
  }catch(e){return false;}
}
function captureGps(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){resolve(null);return;}
    navigator.geolocation.getCurrentPosition(
      pos=>{lastGpsPosition={lat:pos.coords.latitude,lon:pos.coords.longitude};resolve(lastGpsPosition);},
      err=>{console.warn('GPS unavailable:',err.message);resolve(null);},
      {timeout:5000,maximumAge:60000,enableHighAccuracy:false}
    );
  });
}

function togglePass(){
  const p=document.getElementById('loginPass');
  const b=document.getElementById('eyeBtn');
  if(p.type==='password'){p.type='text';b.style.color='var(--white)';}
  else{p.type='password';b.style.color='var(--graphite)';}
}

function setDiag(msg, level){
  const d=document.getElementById('diagLine');
  if(!d)return;
  if(!msg){d.innerHTML='';return;}
  const cls=level||'';
  d.innerHTML='<span class="'+cls+'">'+msg+'</span>';
}
async function initSDK(){
  setDiag('Loading scanner engine...', '');
  try{
    Dynamsoft.License.LicenseManager.initLicense("DLS2eyJoYW5kc2hha2VDb2RlIjoiMTA1MjUzODIxLU1UQTFNalV6T0RJeExYZGxZaTFVY21saGJGQnliMm8iLCJtYWluU2VydmVyVVJMIjoiaHR0cHM6Ly9tZGxzLmR5bmFtc29mdG9ubGluZS5jb20vIiwib3JnYW5pemF0aW9uSUQiOiIxMDUyNTM4MjEiLCJzdGFuZGJ5U2VydmVyVVJMIjoiaHR0cHM6Ly9zZGxzLmR5bmFtc29mdG9ubGluZS5jb20vIiwiY2hlY2tDb2RlIjotMTcyMDI3MzcyOX0=");
    await Dynamsoft.Core.CoreModule.loadWasm(["DBR","DCP"]);
    await Dynamsoft.DCP.CodeParserModule.loadSpec("AAMVA_DL_ID");
    await Dynamsoft.DCP.CodeParserModule.loadSpec("AAMVA_DL_ID_WITH_MAG_STRIPE");
    cvRouter=await Dynamsoft.CVR.CaptureVisionRouter.createInstance();
    try{
      let settings=await cvRouter.getSimplifiedSettings("ReadBarcodes_Balance");
      settings.barcodeSettings.barcodeFormatIds=Dynamsoft.DBR.EnumBarcodeFormat.BF_PDF417;
      await cvRouter.updateSettings("ReadBarcodes_Balance",settings);
      let settings2=await cvRouter.getSimplifiedSettings("ReadBarcodes_ReadRateFirst");
      settings2.barcodeSettings.barcodeFormatIds=Dynamsoft.DBR.EnumBarcodeFormat.BF_PDF417;
      await cvRouter.updateSettings("ReadBarcodes_ReadRateFirst",settings2);
    }catch(e){console.warn("Could not restrict to PDF417:",e);}
    parser=await Dynamsoft.DCP.CodeParser.createInstance();
    sdkReady=true;
    sdkErrorMsg=null;
    setDiag('Scanner ready', 'ok');
    setTimeout(()=>setDiag('', ''), 2500);
  }catch(e){
    sdkErrorMsg=String(e.message||e);
    console.error("SDK init error:", sdkErrorMsg);
    setDiag('Scanner engine error: '+ sdkErrorMsg.slice(0,80), 'err');
    try{cvRouter=await Dynamsoft.CVR.CaptureVisionRouter.createInstance();sdkReady=true;}catch(e2){console.error("SDK total failure:",e2);}
  }
}

async function doLogin(){
  const user=document.getElementById('loginUser').value.trim();
  const pass=document.getElementById('loginPass').value;
  const errEl=document.getElementById('loginError');
  errEl.textContent='';
  try{
    const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})});
    if(!res.ok){
      const errData=await res.json().catch(()=>({}));
      errEl.textContent=(res.status===429)?'Too many attempts - wait 15 min':(errData.error||'Invalid credentials');
      return;
    }
    const data=await res.json();
    tokenSet('ihv_access',data.access_token);
    tokenSet('ihv_refresh',data.refresh_token);
    tokenSet('ihv_user',JSON.stringify(data.user));
    currentUser=data.user;
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appScreen').classList.add('active');
    document.getElementById('userDisplay').textContent=data.user.name+' ('+data.user.role+')';
    if(!sdkReady)initSDK();
    captureGps();
  }catch(e){errEl.textContent='Connection error';}
}

async function doLogout(){
  try{
    const rt=tokenGet('ihv_refresh');
    await authFetch('/api/auth/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});
  }catch(e){/* ignore */}
  tokenClear();
  currentUser=null;
  document.getElementById('appScreen').classList.remove('active');
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginUser').value='';
  document.getElementById('loginPass').value='';
  resetScanUI();
}

async function tryAutoLogin(){
  const u=tokenGet('ihv_user');const at=tokenGet('ihv_access');
  if(!u||!at)return;

document.getElementById('cameraInput').addEventListener('change',async function(e){
  const file=e.target.files[0];if(!file)return;this.value='';
  showStatus('processing','Reading','Hold the picture steady');
  showLoading('Opening photo','');

});

function getRawCanvas(img){
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
  const MAX=4000;
  if(w>MAX||h>MAX){const s=MAX/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
  canvas.width=w;canvas.height=h;ctx.drawImage(img,0,0,w,h);
  return canvas;
}

function preprocessCanvas(img,contrastLevel,invert){
  const canvas=document.createElement('canvas');
  const ctx=canvas.getContext('2d');
  let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
  const MAX=3000;
  if(w>MAX||h>MAX){const s=MAX/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
  canvas.width=w;canvas.height=h;ctx.drawImage(img,0,0,w,h);
  const imageData=ctx.getImageData(0,0,w,h);
  const data=imageData.data;const contrast=contrastLevel||1.5;
  for(let i=0;i<data.length;i+=4){
    let gray=0.299*data[i]+0.587*data[i+1]+0.114*data[i+2];
    gray=((gray-128)*contrast)+128;
    gray=Math.min(255,Math.max(0,gray));
    if(invert)gray=255-gray;
    data[i]=data[i+1]=data[i+2]=gray;
  }
  ctx.putImageData(imageData,0,0);return canvas;
}
// === ZXing-js (open source, zero quota) — PRIMARY engine ===
async function tryZXing(img){
  if(typeof ZXing === 'undefined') return null;
  try{
    const reader = new ZXing.BrowserPDF417Reader();
    const result = await reader.decodeFromImageElement(img);
    if(result && result.text){
      return { rawText: result.text, engine: 'zxing' };
    }
  }catch(e){
    console.warn('ZXing direct read failed:', e.message);
    try{
      const canvas = preprocessCanvas(img, 1.5, false);
      const dataUrl = canvas.toDataURL();
      const tmpImg = new Image();
      await new Promise((res,rej)=>{tmpImg.onload=res;tmpImg.onerror=rej;tmpImg.src=dataUrl;});
      const reader = new ZXing.BrowserPDF417Reader();
      const result = await reader.decodeFromImageElement(tmpImg);
      if(result && result.text){
        return { rawText: result.text, engine: 'zxing-enhanced' };
      }
    }catch(e2){ console.warn('ZXing enhanced read failed:', e2.message); }
  }
  return null;
}

async function processImage(img){
  scanCount++;
  let lastErr=null;
  let engineUsed=null;
  let rawTextFromEngine=null;
  let barcodeItem=null;

  // ============ PASS 0: ZXing (free, no quota) ============
  showLoading('Reading','Open-source engine');
  const zxResult = await tryZXing(img);
  if(zxResult){
    rawTextFromEngine = zxResult.rawText;
    engineUsed = zxResult.engine;
    setDiag('Read via ' + engineUsed, 'ok');
  }

  // ============ FALLBACK: Dynamsoft (commercial) ============
  if(!rawTextFromEngine){
    if(!sdkReady||!cvRouter){
      showLoading('Initializing scanner','First scan takes a moment');
      await initSDK();
      if(!sdkReady){
        hideLoading();
        showStatus('fail','Scanner Engine Failed', sdkErrorMsg || 'Unknown error - check internet connection');
        showRetryBtn();
        return;
      }
    }
    const passes=[
      {label:'Reading (Dynamsoft)',contrast:0,invert:false,template:'ReadBarcodes_Balance'},
      {label:'High-res pass',contrast:0,invert:false,template:'ReadBarcodes_ReadRateFirst'},
      {label:'Enhancing',contrast:1.3,invert:false,template:'ReadBarcodes_Balance'},
      {label:'Boosting contrast',contrast:1.8,invert:false,template:'ReadBarcodes_ReadRateFirst'},
      {label:'Deep scan',contrast:2.2,invert:false,template:'ReadBarcodes_ReadRateFirst'},
      {label:'Inverted',contrast:1.5,invert:true,template:'ReadBarcodes_ReadRateFirst'},
    ];
    for(let p=0;p<passes.length;p++){
      showLoading(passes[p].label,'Pass '+(p+1)+' of '+passes.length);
      try{
        const canvas=(passes[p].contrast===0)?getRawCanvas(img):preprocessCanvas(img,passes[p].contrast,passes[p].invert);
        const result=await cvRouter.capture(canvas,passes[p].template);
        if(result&&result.items){
          barcodeItem=result.items.find(item=>item.type===2||item.type===Dynamsoft.Core.EnumCapturedResultItemType.CRIT_BARCODE);
          if(barcodeItem){ engineUsed='dynamsoft'; break; }
        }
      }catch(e){lastErr=String(e.message||e);console.warn("Pass "+(p+1)+" failed:",lastErr);}
    }
  }

  if(!rawTextFromEngine && !barcodeItem){
    hideLoading();
    let detail = 'Hold the BACK of the license closer - 4 to 6 inches from camera. Use bright light.';
    if(lastErr){
      if(lastErr.toLowerCase().includes('license')) detail = 'Scanner license issue: '+lastErr.slice(0,60);
      else if(lastErr.toLowerCase().includes('quota')) detail = 'Daily quota reached - free engine also failed';
      else if(lastErr.toLowerCase().includes('network')) detail = 'Network issue - check connection';
    }
    showStatus('fail','No Barcode Detected', detail);
    showRetryBtn();
    return;
  }

  showLoading('Extracting license data', 'Engine: ' + engineUsed);
  let fields = {};
  if(rawTextFromEngine){
    fields = parseAAMVAText(rawTextFromEngine);
  } else {
    fields = await parseLicense(barcodeItem);
  }
  hideLoading();
  if(fields && Object.keys(fields).length > 0){
    setDiag('Decoded via ' + engineUsed + ' - ' + Object.keys(fields).length + ' fields', 'ok');
    displayResult(fields);
  } else {
    showStatus('fail','Barcode found but unreadable','Try a clearer photo');
    showRetryBtn();
  }
}

async function parseLicense(barcodeItem){
  let fields={};
  let rawText='';
  if(barcodeItem.text) rawText=barcodeItem.text;
  else if(barcodeItem.barcodeText) rawText=barcodeItem.barcodeText;
  if((!rawText||rawText.length<20)&&barcodeItem.bytes){
    try{
      const bytes=barcodeItem.bytes instanceof Uint8Array?barcodeItem.bytes:new Uint8Array(barcodeItem.bytes);
      rawText=new TextDecoder('utf-8').decode(bytes);
      if(!rawText||rawText.length<20) rawText=new TextDecoder('latin1').decode(bytes);
    }catch(e){console.warn('Byte decode failed:',e);}
  }
  if(parser&&barcodeItem.bytes){
    try{
      const parsed=await parser.parse(barcodeItem.bytes);
      if(parsed){
        let jsonStr=parsed.jsonString||parsed.getJsonString&&parsed.getJsonString()||null;
        if(jsonStr){
          const dlInfo=JSON.parse(jsonStr);
          fields=extractFieldsFromCodeParser(dlInfo);
          if(fields.lastName||fields.firstName||fields.dlNumber)return fields;
        }
      }
    }catch(e){console.warn('CodeParser error:',e.message);}
  }
  if(rawText.length>20){
    fields=parseAAMVAText(rawText);
    if(fields.lastName||fields.firstName||fields.dlNumber)return fields;
  }
  return fields;
}

function extractFieldsFromCodeParser(dlInfo){
  const fields={};const flat=flattenObject(dlInfo);
  const mapping={
    firstName:['firstName','First Name','DAC','first_name','givenName','Given Name','DCT'],
    lastName:['lastName','Last Name','DCS','last_name','familyName','Family Name','surname','Surname'],
    dob:['dateOfBirth','Date of Birth','DBB','date_of_birth','birthDate','Birth Date','DOB'],
    dlNumber:['licenseNumber','License Number','DAQ','license_number','documentNumber','Document Number','DL Number'],
    expiration:['expirationDate','Expiration Date','DBA','expiration_date','Expiry Date'],
    state:['state','State','DAJ','jurisdictionCode','Jurisdiction Code','issuingJurisdiction'],
    street:['street','Street','DAG','street_address','addressStreet','Address Street','Address - Street 1'],
    city:['city','City','DAI','addressCity','Address - City'],
    zip:['zip','ZIP','DAK','postalCode','Postal Code','zipCode','Address - Postal Code']
  };
  for(const[field,keys]of Object.entries(mapping)){for(const key of keys){const val=flat[key];if(val&&String(val).trim()){fields[field]=String(val).trim();break;}}}
  return fields;
}

function flattenObject(obj,prefix,result){
  result=result||{};prefix=prefix||'';
  if(!obj||typeof obj!=='object')return result;
  for(const key of Object.keys(obj)){
    const val=obj[key];const newKey=prefix?prefix+'.'+key:key;
    if(val&&typeof val==='object'&&!Array.isArray(val)){flattenObject(val,newKey,result);}
    else{result[key]=val;result[newKey]=val;}
  }
  return result;
}

function parseAAMVAText(raw){
  const fields={};
  const codes={DCS:'lastName',DAC:'firstName',DCT:'firstName',DBB:'dob',DAQ:'dlNumber',DBA:'expiration',DAJ:'state',DAG:'street',DAI:'city',DAK:'zip'};
  const lines=raw.split(/[\n\r]+/);
  for(const line of lines){for(const[code,field]of Object.entries(codes)){
    if(line.startsWith(code)||line.includes(code)){
      const idx=line.indexOf(code);let val=line.substring(idx+code.length).trim();
      if(val&&!fields[field])fields[field]=val;
    }
  }}
  if(fields.dob&&fields.dob.length===8&&!fields.dob.includes('/'))fields.dob=fields.dob.slice(0,2)+'/'+fields.dob.slice(2,4)+'/'+fields.dob.slice(4);
  if(fields.expiration&&fields.expiration.length===8&&!fields.expiration.includes('/'))fields.expiration=fields.expiration.slice(0,2)+'/'+fields.expiration.slice(2,4)+'/'+fields.expiration.slice(4);
  if(fields.zip&&fields.zip.length>5)fields.zip=fields.zip.substring(0,5);
  return fields;
}
function displayResult(fields){
  lastScanData=fields;
  const setField=(id,val)=>{const el=document.getElementById(id);if(val&&val!=='-'){el.textContent=val;el.classList.remove('empty');}else{el.textContent='-';el.classList.add('empty');}};
  setField('fFirstName',fields.firstName);setField('fLastName',fields.lastName);
  setField('fDOB',fields.dob);setField('fDLNumber',fields.dlNumber);
  setField('fExpiration',fields.expiration);setField('fState',fields.state);
  let addr=[fields.street,fields.city,fields.state,fields.zip].filter(Boolean).join(', ');
  setField('fAddress',addr||null);
  const filled=[fields.firstName,fields.lastName,fields.dob,fields.dlNumber,fields.expiration,fields.state,fields.street].filter(Boolean).length;
  const badge=document.getElementById('riskBadge');
  let isExpired=false;
  if(fields.expiration){
    try{
      const parts=fields.expiration.split('/');
      let expDate;
      if(parts.length===3){
        expDate=new Date(parseInt(parts[2]),parseInt(parts[0])-1,parseInt(parts[1]));
      }
      if(expDate&&expDate<new Date()){isExpired=true;}
    }catch(e){}
  }
  if(isExpired){
    badge.textContent='EXPIRED';badge.className='risk-badge risk-red';
    showStatus('fail','License Expired','Expired '+fields.expiration);
  }else if(filled>=5){
    badge.textContent='VERIFIED';badge.className='risk-badge risk-green';
    showStatus('success','Verified',filled+' of 7 fields read');
  }else if(filled>=3){
    badge.textContent='PARTIAL';badge.className='risk-badge risk-yellow';
    showStatus('partial','Partial Read',filled+' of 7 fields - check below');
  }else{
    badge.textContent='INCOMPLETE';badge.className='risk-badge risk-red';
    showStatus('fail','Incomplete Read','Only '+filled+' of 7 fields - try again');
  }
  document.getElementById('resultCard').classList.add('visible');
  document.getElementById('actionRow').style.display='flex';
  document.getElementById('bolSection').style.display='block';
  document.getElementById('retryBtn').style.display='none';
}

async function saveScan(){
  if(!lastScanData)return;
  const bolData={
    carrier:document.getElementById('bolCarrier').value.trim(),
    bolNumber:document.getElementById('bolNumber').value.trim(),
    loadDescription:document.getElementById('bolLoad').value.trim(),
    dock:document.getElementById('bolDock').value.trim()
  };
  const gps=lastGpsPosition||(await captureGps());
  const siteId=tokenGet('ihv_site')||'demo_site';
  const payload={license:lastScanData,bol:bolData,scanned_by:currentUser?currentUser.username:'unknown'};
  const identifierShort=(lastScanData.dlNumber||'').slice(-4)||(bolData.bolNumber||null);
  const body={
    site_id:siteId,
    scan_type:'driver_license',
    payload:JSON.stringify(payload),
    identifier_short:identifierShort,
    gps_lat:gps?gps.lat:null,
    gps_lon:gps?gps.lon:null,
    metadata:{bol_number:bolData.bolNumber||null,carrier:bolData.carrier||null,load:bolData.loadDescription||null,dock:bolData.dock||null}
  };
  try{
    const res=await authFetch('/api/scans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(res.ok){
      const r=await res.json();
      showStatus('success','Saved', r.result + ' saved');
      setTimeout(()=>resetScanUI(),1500);
    }else if(res.status===401){
      tokenClear();showStatus('fail','Session Expired','Please log in again');setTimeout(()=>doLogout(),1500);
    }else{
      queueOfflineScan(body);
      showStatus('partial','Saved Offline','Will sync when reconnected');
      setTimeout(()=>resetScanUI(),1800);
    }
  }catch(e){
    queueOfflineScan(body);
    showStatus('partial','Offline','Scan queued - will sync');
    setTimeout(()=>resetScanUI(),1800);
  }
}

function queueOfflineScan(body){
  try{
    const q=JSON.parse(localStorage.getItem('ihv_offline_queue')||'[]');
    q.push({body,queued_at:new Date().toISOString()});
    localStorage.setItem('ihv_offline_queue',JSON.stringify(q));
  }catch(e){console.warn('Queue failed:',e);}
}
async function flushOfflineQueue(){
  try{
    const q=JSON.parse(localStorage.getItem('ihv_offline_queue')||'[]');
    if(q.length===0)return;
    const remaining=[];
    for(const item of q){
      try{
        const res=await authFetch('/api/scans',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item.body)});
        if(!res.ok)remaining.push(item);
      }catch(e){remaining.push(item);}
    }
    localStorage.setItem('ihv_offline_queue',JSON.stringify(remaining));
  }catch(e){console.warn('Flush failed:',e);}
}
window.addEventListener('online',()=>{flushOfflineQueue();});
setInterval(()=>{if(navigator.onLine&&currentUser)flushOfflineQueue();},30000);

async function loadHistory(){
  try{
    const res=await authFetch('/api/scans/recent');
    if(!res.ok){
      document.getElementById('historyList').innerHTML='<div class="empty-history">Could not load history</div>';
      return;
    }
    const data=await res.json();
    const el=document.getElementById('historyList');
    if(!data.scans||data.scans.length===0){el.innerHTML='<div class="empty-history">No scans yet</div>';return;}
    el.innerHTML=data.scans.map(s=>{
      let meta={};try{meta=s.metadata_json?JSON.parse(s.metadata_json):{};}catch(e){}
      const name=s.identifier_short?'ID ending '+s.identifier_short:'Scan';
      const bol=meta.bol_number?' | BOL: '+meta.bol_number:'';
      const carrier=meta.carrier?' | '+meta.carrier:'';
      const time=new Date(s.timestamp).toLocaleString();
      const cls=s.result==='PASS'?'risk-green':s.result==='PARTIAL'?'risk-yellow':'risk-red';
      return '<div class="history-item"><div><div class="history-name">'+name+bol+'</div><div class="history-time">'+time+carrier+'</div></div><div class="history-badge '+cls+'">'+s.result+'</div></div>';
    }).join('');
  }catch(e){console.error("History load failed:",e);}
}

window.addEventListener('DOMContentLoaded',()=>{tryAutoLogin();flushOfflineQueue();});

function showStatus(type,msg,sub){
  const el=document.getElementById('statusBar');
  el.className='status-banner '+type;
  el.innerHTML = msg + (sub ? '<span class="status-banner-sub">'+sub+'</span>' : '');
}
function showRetryBtn(){document.getElementById('retryBtn').style.display='block';document.getElementById('actionRow').style.display='none';}
function showLoading(text,sub){document.getElementById('loadingText').textContent=text;document.getElementById('loadingSub').textContent=sub||'';document.getElementById('loadingOverlay').classList.add('visible');}
function hideLoading(){document.getElementById('loadingOverlay').classList.remove('visible');}
function resetScanUI(){
  const sb=document.getElementById('statusBar');
  sb.className='status-banner';
  sb.innerHTML='';
  document.getElementById('resultCard').classList.remove('visible');
  document.getElementById('actionRow').style.display='none';
  document.getElementById('retryBtn').style.display='none';
  lastScanData=null;
  ['fFirstName','fLastName','fDOB','fDLNumber','fExpiration','fState','fAddress'].forEach(id=>{const el=document.getElementById(id);el.textContent='-';el.classList.add('empty');});
  document.getElementById('bolSection').style.display='none';
  ['bolCarrier','bolNumber','bolLoad','bolDock'].forEach(id=>{document.getElementById(id).value='';});
}
